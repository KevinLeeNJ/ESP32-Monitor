# ESP32-Monitor V1 / macOS
# 复制后修改 URL 和 UPLOAD_TOKEN；不要提交填写了真实 Token 的配置。
# 磁盘路径必须与 Server 的 panel.devices[].disk_mount_path 完全一致。
[agent]
  interval = "10s"
  round_interval = true
  flush_interval = "10s"
  collection_jitter = "0s"
  flush_jitter = "1s"
  metric_batch_size = 100
  metric_buffer_limit = 1000
  omit_hostname = true

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.disk]]
  # 默认监控根目录；如需监控 APFS 数据卷，请先确认其实际挂载点。
  mount_points = ["/"]

[[inputs.system]]
  include = ["uptime"]

[[outputs.http]]
  # Base URL 后追加此固定路径；保留实际部署使用的 HTTPS 端口。
  url = "https://monitor.example.com/v1/ingest/telegraf"
  method = "POST"
  timeout = "5s"
  use_system_proxy = false
  tls_min_version = "TLS12"
  insecure_skip_verify = false
  data_format = "json"
  json_timestamp_units = "1s"
  use_batch_format = true
  content_encoding = "identity"
  non_retryable_statuscodes = [400, 401, 403, 404, 413, 415, 422]

  # headers 表必须放在本输出插件的最后。
  [outputs.http.headers]
    Content-Type = "application/json"
    Authorization = "Bearer <UPLOAD_TOKEN>"
