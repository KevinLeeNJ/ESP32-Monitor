# 脱敏 schema 示例，不可直接 serve。请用 configure 生成真实随机 Token。
listen: "127.0.0.1:8080"
public_base_url: "https://monitor.example.com"
database: "./data/monitor.db"
online_timeout_seconds: 45
metric_ttl_seconds: 45
history_retention_hours: 24
read_token: "<configure 生成的面板只读 Token>"
agents:
  - id: nas
    write_token: "<configure 为 NAS 生成的上传 Token>"
panel:
  devices:
    - id: nas
      name: NAS
      uptime_source: {measurement: system, tags: {}, field: uptime}
      disk_mount_path: "/"
