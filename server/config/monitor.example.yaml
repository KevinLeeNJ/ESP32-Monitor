# v2 示例：先运行 configure，或 serve 自动创建私有配置和随机只读 Token。
# WebUI 密码保存在 SQLite，首次启动时随机生成并打印到终端。
listen: "0.0.0.0:8080"
public_base_url: "https://monitor.example.com"
database: "./data/monitor.db"
online_timeout_seconds: 45
metric_ttl_seconds: 45
history_retention_hours: 24
read_token: "<configure 生成的面板只读 Token>"
# 设备注册、上传凭据及面板磁盘选择在 WebUI 管理。
